services:
  - type: web
    name: buildbuddy-api
    runtime: python
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: UV_VERSION
        value: latest
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://build-buddy-lovat.vercel.app
      - key: STORAGE_DIR
        value: /var/data/generations
    disk:
      name: buildbuddy-data
      mountPath: /var/data
      sizeGB: 1
